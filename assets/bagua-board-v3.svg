  <circle cx="500" cy="500" r="136" fill="#D6AA5B"/>
  <path d="M500 364 A136 136 0 0 0 500 636 A68 68 0 0 1 500 500 A68 68 0 0 0 500 364 Z" fill="#1B2A4A"/>
