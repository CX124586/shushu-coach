      <use href="#v3-broken"/>
      <use href="#v3-solid" transform="translate(0 26)"/>
    </g>
    <g id="v3-kun">
      <use href="#v3-broken" transform="translate(0 -26)"/>
      <use href="#v3-broken"/>
      <use href="#v3-broken" transform="translate(0 26)"/>
    </g>
    <g id="v3-gen">
      <use href="#v3-solid" transform="translate(0 -26)"/>
      <use href="#v3-broken"/>
      <use href="#v3-broken" transform="translate(0 26)"/>
    </g>
    <g id="v3-kan">
      <use href="#v3-broken" transform="translate(0 -26)"/>
      <use href="#v3-solid"/>
      <use href="#v3-broken" transform="translate(0 26)"/>
    </g>
    <g id="v3-xun">
      <use href="#v3-solid" transform="translate(0 -26)"/>
      <use href="#v3-solid"/>
      <use href="#v3-broken" transform="translate(0 26)"/>
