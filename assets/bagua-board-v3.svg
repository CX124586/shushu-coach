    <g transform="rotate(67.5) translate(0 -298)"><use href="#v3-dui"/></g>
    <g transform="rotate(112.5) translate(0 -298)"><use href="#v3-li"/></g>
    <g transform="rotate(157.5) translate(0 -298)"><use href="#v3-zhen"/></g>
    <g transform="rotate(202.5) translate(0 -298)"><use href="#v3-kun"/></g>
