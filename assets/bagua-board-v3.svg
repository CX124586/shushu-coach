<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="v3-gold" x1="140" y1="130" x2="860" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6AA5B"/>
      <stop offset="0.5" stop-color="#C8923E"/>
      <stop offset="1" stop-color="#9A6827"/>
    </linearGradient>
    <g id="v3-solid">
      <rect x="-31" y="-6" width="62" height="12" rx="2" fill="#1B2A4A"/>
    </g>
    <g id="v3-broken">
      <rect x="-31" y="-6" width="25" height="12" rx="2" fill="#1B2A4A"/>
      <rect x="6" y="-6" width="25" height="12" rx="2" fill="#1B2A4A"/>
    </g>
    <g id="v3-qian">
      <use href="#v3-solid" transform="translate(0 -26)"/>
      <use href="#v3-solid"/>
      <use href="#v3-solid" transform="translate(0 26)"/>
    </g>
    <g id="v3-dui">
      <use href="#v3-broken" transform="translate(0 -26)"/>
      <use href="#v3-solid"/>
      <use href="#v3-solid" transform="translate(0 26)"/>
    </g>
    <g id="v3-li">
