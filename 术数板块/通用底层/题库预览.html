<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通用底层 · 题库预览</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { padding: 28px clamp(20px, 5vw, 64px) 40px; }
    main { max-width: 920px; margin: 0 auto; }
    .preview-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .preview-toolbar input,
    .preview-toolbar select {
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
    }
    .question-list { display: grid; gap: 10px; }
    details.question-item { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    summary { padding: 12px 14px; cursor: pointer; font-weight: 700; }
    .question-body { padding: 0 14px 14px; }
    .question-meta { color: var(--muted); font-size: 13px; }
    .answer { color: var(--pine); font-weight: 700; }
    @media print { .preview-toolbar { display: none; } details { border: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">术数板块 · 通用底层</p>
    <h1>题库预览</h1>
    <p>这里可以单独查阅全部题目，不进入练习模式。</p>
    <div class="preview-toolbar">
      <input id="search" type="search" placeholder="搜索题目或标签">
      <select id="type-filter">
        <option value="">全部题型</option>
        <option value="choice">选择题</option>
        <option value="fill">填空题</option>
        <option value="scenario">情景题</option>
      </select>
      <select id="topic-filter">
        <option value="">全部知识点</option>
      </select>
      <span id="count" class="question-meta"></span>
    </div>
    <section id="list" class="question-list"></section>
  </main>

  <script src="questions.js"></script>
  <script>
    const all = window.PRACTICE_QUESTIONS || [];
    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const typeEl = document.getElementById("type-filter");
    const topicEl = document.getElementById("topic-filter");
    const countEl = document.getElementById("count");
    const typeNames = { choice: "选择题", fill: "填空题", scenario: "情景题" };

    function render() {
      const keyword = searchEl.value.trim().toLowerCase();
      const type = typeEl.value;
      const topic = topicEl.value;
      const filtered = all.filter((q) => {
        const text = JSON.stringify(q).toLowerCase();
        const matchKeyword = !keyword || text.includes(keyword);
        const matchType = !type || q.type === type;
        const matchTopic = !topic || q.topic === topic;
        return matchKeyword && matchType && matchTopic;
      });

      countEl.textContent = "显示 " + filtered.length + " / " + all.length + " 题";
      listEl.innerHTML = "";

      filtered.forEach((q, index) => {
        const item = document.createElement("details");
        item.className = "question-item";

        const answerText = q.answerText
          ? q.answerText.join(" / ")
          : q.options
            ? q.options[q.answer]
            : "主动回忆";

        item.innerHTML = `
          <summary>${index + 1}. ${q.prompt}</summary>
          <div class="question-body">
            ${q.scenario ? `<p><strong>情景：</strong>${q.scenario}</p>` : ""}
            ${q.options ? `<p><strong>选项：</strong>${q.options.join("、")}</p>` : ""}
            <p><strong>答案：</strong><span class="answer">${answerText}</span></p>
            <p><strong>解释：</strong>${q.explanation}</p>
            <p class="question-meta">知识点：${q.topic || "未分类"} · 题型：${typeNames[q.type] || q.type} · 标签：${(q.tags || []).join("、")}</p>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    searchEl.addEventListener("input", render);
    typeEl.addEventListener("change", render);
    topicEl.addEventListener("change", render);

    const topics = [...new Set(all.map((q) => q.topic).filter(Boolean))].sort();
    topics.forEach((topic) => {
      const option = document.createElement("option");
      option.value = topic;
      option.textContent = topic;
      topicEl.appendChild(option);
    });

    render();
  </script>
</body>
</html>
